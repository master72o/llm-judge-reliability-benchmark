[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-judge-reliability-benchmark"
version = "1.0.0"
description = "A controlled research benchmark measuring LLM-as-a-Judge reliability, verbosity bias, position bias, and prompt ablation."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "LLM Evaluation Specialist & AI Researcher", email = "research@example.com" }
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
    "statsmodels>=0.13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
judge-benchmark = "judge_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["judge_benchmark*"]
